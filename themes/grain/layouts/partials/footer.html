<hr style="border: none; border-top: 1px solid var(--border); margin: 0;">
<footer class="site-footer">
  &copy; {{ now.Year }} <a href="{{ "" | relURL }}">{{ site.Title }}</a>
  {{- with site.Params.footerExtra }}
  · {{ . | markdownify }}
  {{- end }}
  {{- if .GitInfo }}
  <br><span class="footer-gitinfo">rev {{ .GitInfo.AbbreviatedHash }} · {{ .GitInfo.AuthorDate.Format "Jan 2, 2006" }}</span>
  {{- end }}
</footer>

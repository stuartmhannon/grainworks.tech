<!-- Global error handler — captures runtime errors to localStorage (capped at 100) -->
<script>
window.onerror = function (message, source, line, col, error) {
  var msg = typeof message === 'string' ? message : (message && message.message ? message.message : '');
  var entry = {
    timestamp: new Date().toISOString(),
    message: msg,
    source: source || '',
    line: line || 0,
    col: col || 0,
  };
  try {
    var arr = JSON.parse(localStorage.getItem('workbench_errors') || '[]');
    arr.push(entry);
    // FIFO: keep newest 100
    if (arr.length > 100) arr = arr.slice(arr.length - 100);
    localStorage.setItem('workbench_errors', JSON.stringify(arr));
  } catch (_) {}
  // Update footer count
  var link = document.getElementById('err-footer-link');
  if (link) {
    var cnt;
    try { cnt = JSON.parse(localStorage.getItem('workbench_errors') || '[]').length; } catch (_) { cnt = 0; }
    link.textContent = '\u26a0 ' + cnt + ' error' + (cnt === 1 ? '' : 's');
  }
};
</script>

<script type="module">

/**
 * Load all data files and render initial views.

    const resp = await fetch('./data/routes.json?_=' + Date.now());
    routesData = await resp.json();

    document.getElementById('dashboard-container').innerHTML = '<div class="empty-state"><div class="big-icon">⚠</div>Failed to load Dashboard panel</div>';

    document.getElementById('inbox-container').innerHTML = '<div class="empty-state"><div class="big-icon">⚠</div>Failed to load Inbox panel</div>';
    console.warn('renderInbox:', e);

  try { renderEmail(document.getElementById('email-container')); } catch (e) {
    document.getElementById('email-container').innerHTML = '<div class="empty-state"><div class="big-icon">⚠</div>Failed to load Email panel</div>';

  });

  // Render library (lazy-loaded)

    mod.renderLibrary(document.getElementById('tab-library'));
  }).catch(() => {});

  try { renderStatus(document.getElementById('tab-status'), routesData); } catch (e) {
    document.getElementById('tab-status').innerHTML = '<div class="empty-state"><div class="big-icon">⚠</div>Failed to load Status panel</div>';
    console.warn('renderStatus:', e);
  }
  try { renderLogs(document.getElementById('tab-logs')); } catch (e) {
    document.getElementById('tab-logs').innerHTML = '<div class="empty-state"><div class="big-icon">⚠</div>Failed to load Logs panel</div>';
    console.warn('renderLogs:', e);
  }

  // Render tower (lazy-loaded)
  import('./js/tower-panel.js').then(mod => {
    mod.renderTower(document.getElementById('tower-container'));
  }).catch(() => {});

  // Render network 3D graph (lazy-loaded)
  import('./js/network-3d.js').then(mod => {
    mod.renderNetwork3D(document.getElementById('network-container'));
  }).catch(() => {});

  // Render cron dashboard (lazy-loaded)

  toggleBtn.addEventListener('click', () => {

    const dagEl = document.getElementById('dag-container');
    const pipeEl = document.getElementById('pipeline-container');
    if (isPipelineView) {
      stopPipelineViz();
      dagEl.style.display = 'none';
      pipeEl.style.display = 'block';
      renderDAG(pipeEl, routesData, { live: true });
      toggleBtn.textContent = '◂ topology';
    } else {
      stopPipelineViz();
      pipeEl.style.display = 'none';
      dagEl.style.display = 'block';
      renderDAG(dagEl, routesData);
      toggleBtn.textContent = '▸ pipeline';
    }
  });

  // Refresh live data every 60s — register for cleanup on tab switch
  window._intervals = window._intervals || [];
  window._intervals.push(setInterval(refreshLive, 60000));
}

/**
 * Refresh system + log data without re-downloading routes.
 */
async function refreshLive() {
  await loadLiveData();
  const activeTab = document.querySelector('.tab-content.active');
  if (activeTab) {
    if (activeTab.id === 'tab-status') {
      try { renderStatus(document.getElementById('tab-status'), routesData); } catch (e) {
        document.getElementById('tab-status').innerHTML = '<div class="empty-state"><div class="big-icon">⚠</div>Failed to load Status panel</div>';
        console.warn('renderStatus(refresh):', e);
      }
    } else if (activeTab.id === 'tab-logs') {
      try { renderLogs(document.getElementById('tab-logs')); } catch (e) {
        document.getElementById('tab-logs').innerHTML = '<div class="empty-state"><div class="big-icon">⚠</div>Failed to load Logs panel</div>';
        console.warn('renderLogs(refresh):', e);
      }
    }
  }
}

function sumRoutes(r) {
  return (r.operational?.length || 0) + (r.enterprise?.length || 0);
}

/**
 * Clear all globally-registered intervals. Call before switching tabs
 * to prevent stale intervals from accumulating on hidden panels.
 */
function clearAllIntervals() {
  (window._intervals || []).forEach(clearInterval);
  window._intervals = [];
}

      document.getElementById('chat-container').innerHTML = '<div class="empty-state"><div class="big-icon">⚠</div>Failed to load Chat panel</div>';

    if (cc) import('./js/cron-panel.js').then(m => {

document.querySelectorAll('.nav-item').forEach(el => {
  el.addEventListener('click', () => {
    const tab = el.dataset.tab;
    if (!tab) return;

    // Clear stale intervals from previously active panels
    clearAllIntervals();

    document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));

    document.querySelectorAll(`.nav-item[data-tab="${tab}"]`).forEach(n => n.classList.add('active'));
    document.getElementById(`tab-${tab}`).classList.add('active');

    if (tabRenderers[tab]) tabRenderers[tab]();
  });
});

// Mobile hamburger menu
const menuBtn = document.getElementById('mobile-menu-btn');
const sidebarOverlay = document.getElementById('sidebar-overlay');
if (menuBtn && sidebarOverlay) {
  menuBtn.addEventListener('click', () => {
    document.querySelector('.sidebar').classList.toggle('open');
    document.getElementById('sidebar-overlay').classList.toggle('show');
  });
  sidebarOverlay.addEventListener('click', closeSidebar);
  document.querySelectorAll('.sidebar .nav-item').forEach(item => {
    item.addEventListener('click', closeSidebar);
  });
  function closeSidebar() {
    document.querySelector('.sidebar')?.classList.remove('open');
    document.getElementById('sidebar-overlay')?.classList.remove('show');
  }
}

// Keyboard shortcuts: Ctrl+[1-9] to switch tabs
const tabByKey = ['dashboard','inbox','email','dag','projects','chat','sessions','cron','library'];
document.addEventListener('keydown', (e) => {
  if (!e.ctrlKey && !e.metaKey) return;
  const digit = parseInt(e.key, 10);
  if (digit < 1 || digit > 9) return;
  const target = e.target;
  if (target.tagName === 'INPUT' || target.tagName === 'TEXTAREA' || target.isContentEditable) return;
  e.preventDefault();
  const navItem = document.querySelector(`.nav-item[data-tab="${tabByKey[digit - 1]}"]`);
  if (navItem) navItem.click();
});

// Keyboard shortcut: `/` focuses the first search input in the active tab
document.addEventListener('keydown', (e) => {
  if (e.key === '/') {
    const target = e.target;
    if (target.tagName === 'INPUT' || target.tagName === 'TEXTAREA' || target.isContentEditable) return;
    e.preventDefault();
    const activeTab = document.querySelector('.tab-content.active');
    if (!activeTab) return;
    const searchInput = activeTab.querySelector('.search-input');
    if (searchInput) searchInput.focus();
  }
  // Ctrl+K / Cmd+K — open quick search modal
  if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
    e.preventDefault();
    alert('Quick search coming in v1.0.1');
  }
});

/**
 * Close any open overlay or detail panel by removing its container element.
 * Recognises all overlay/detail-panel CSS classes used across modules.
 */
window.closeOverlay = function () {
  const selectors = [
    '.pv-drill-overlay',
    '.project-detail-overlay',
    '.lib-detail-overlay',
    '.email-detail-overlay',
    '.qp-add-overlay',
    '.qp-detail-overlay',
    '.si-detail-overlay',
    '.si-detail-panel',
    '.bld-modal-overlay',
  ];
  selectors.forEach(sel => {
    const el = document.querySelector(sel);
    if (el) el.remove();
  });
};

// Keyboard shortcut: Escape closes any open overlay or detail panel
document.addEventListener('keydown', (e) => {
  if (e.key !== 'Escape') return;
  const target = e.target;
  if (target.tagName === 'INPUT' || target.tagName === 'TEXTAREA' || target.isContentEditable) return;
  e.preventDefault();
  window.closeOverlay();
});

// Start
init();

/**
 * Walk the document body and count all DOM nodes.
 * Use: window.__domCount() to audit node counts per tab.
 */
window.__domCount = function () {
  var counts = {};
  function walk(node) {
    if (!node || !node.tagName) return;
    var tag = node.tagName.toLowerCase();
    counts[tag] = (counts[tag] || 0) + 1;
    if (node.id) {
      counts['#' + node.id] = (counts['#' + node.id] || 0) + 1;
    }
    // Count children and walk recursively
    var child = node.firstElementChild;
    while (child) {
      walk(child);
      child = child.nextElementSibling;
    }
  }
  walk(document.body);
  var total = 0;
  var lines = ['DOM node count by tag:'];
  Object.keys(counts).sort().forEach(function (k) {
    lines.push(k + ': ' + counts[k]);
    total += counts[k];
  });
  lines.push('--- total nodes: ' + total);
  console.log(lines.join('\n'));
  return { counts: counts, total: total };
};
</script>

<!-- SSE live updates — replaces polling with push-based re-renders -->
<script type="module">
import { subscribeSSE } from './js/sse-client.js';

// Map data filenames to tab IDs that should re-render on change
const dataTabMap = {
  'tasks.json': ['projects', 'queue-summary'],
  'task-live.json': ['projects', 'queue-summary'],
  'system.json': ['tower', 'dashboard'],
  'logs.json': ['logs'],
  'cron-status.json': ['cron'],
  'sessions-live.json': ['sessions'],
  'ideas-index.json': ['library'],
};

// Fire tab nav click to trigger re-render
function triggerTabRender(tabIds) {
  const activeTab = document.querySelector('.tab-content.active');
  if (!activeTab) return;
  const currentTabId = activeTab.id.replace('tab-', '');
  if (tabIds.includes(currentTabId)) {
    const navItem = document.querySelector(`.nav-item[data-tab="${currentTabId}"]`);
    if (navItem) navItem.click();
  }
}

subscribeSSE('/events', {
  onFileChange(fileName) {
    const tabs = dataTabMap[fileName];
    if (tabs) triggerTabRender(tabs);
  },
  onConnectionChange(status) {
    const indicator = document.getElementById('status-indicator');
    if (!indicator) return;
    if (status === 'connected') {
      indicator.textContent = '● live';
      indicator.className = 'connected';
    } else if (status === 'reconnecting') {
      indicator.textContent = '● reconnecting...';
      indicator.className = 'warn';
    } else {
      indicator.textContent = '● polling';
      indicator.className = 'disconnected';
    }
  },
  onError(err) {
    console.warn('[SSE]', err.message);
    // Fallback: if SSE connection fails, fall back to polling
    setTimeout(() => {
      const indicator = document.getElementById('status-indicator');
      if (indicator && indicator.textContent === '● offline') {
        indicator.textContent = '● polling';
        indicator.className = 'disconnected';
      }
    }, 10000);
  }
});
</script>

<!-- Error viewer overlay -->
<div id="err-overlay" class="err-overlay error-log-modal" style="display:none">
  <div class="err-modal" style="position:relative">
    <span class="err-close" id="err-overlay-close">&times;</span>
    <h2>&#9888; Error Log</h2>
    <div class="err-toolbar">
      <button id="err-clear-btn" class="err-btn danger">Clear</button>
      <span style="flex:1"></span>
    </div>
    <div class="err-table-wrap">
      <table>
        <thead><tr><th>Timestamp</th><th>Message</th><th>Source</th><th>Line</th></tr></thead>
        <tbody id="err-table-body"></tbody>
      </table>
      <div id="err-empty" class="err-empty" style="display:none">No errors captured.</div>
    </div>
  </div>
</div>

<script>
// Wire error viewer
document.addEventListener('DOMContentLoaded', function () {
  var link = document.getElementById('err-footer-link');
  var overlay = document.getElementById('err-overlay');
  var closeBtn = document.getElementById('err-overlay-close');
  var clearBtn = document.getElementById('err-clear-btn');
  var tbody = document.getElementById('err-table-body');
  var emptyMsg = document.getElementById('err-empty');

  function renderErrors() {
    var arr;
    try { arr = JSON.parse(localStorage.getItem('workbench_errors') || '[]'); } catch (_) { arr = []; }
    var link = document.getElementById('err-footer-link');
    if (link) link.textContent = '\u26a0 ' + arr.length + ' error' + (arr.length === 1 ? '' : 's');
    if (!tbody) return;
    tbody.innerHTML = '';
    if (arr.length === 0) {
      if (emptyMsg) emptyMsg.style.display = '';
      return;
    }
    if (emptyMsg) emptyMsg.style.display = 'none';
    arr.slice().reverse().forEach(function (e) {
      var tr = document.createElement('tr');
      var ts = document.createElement('td');
      ts.textContent = (e.timestamp || '').replace('T', ' ').slice(0, 19);
      var msg = document.createElement('td');
      msg.textContent = e.message || '';
      var src = document.createElement('td');
      src.textContent = (e.source || '').split('/').pop() || '-';
      var ln = document.createElement('td');
      ln.textContent = e.line != null ? e.line : '';
      tr.appendChild(ts);
      tr.appendChild(msg);
      tr.appendChild(src);
      tr.appendChild(ln);
      tbody.appendChild(tr);
    });
  }

  if (link && overlay) {
    link.addEventListener('click', function () {
      renderErrors();
      overlay.style.display = '';
    });
  }
  if (closeBtn && overlay) {
    closeBtn.addEventListener('click', function () { overlay.style.display = 'none'; });
  }
  if (clearBtn) {
    clearBtn.addEventListener('click', function () {
      localStorage.setItem('workbench_errors', '[]');
      renderErrors();
    });
  }

  // Initial count update
  var initArr;
  try { initArr = JSON.parse(localStorage.getItem('workbench_errors') || '[]'); } catch (_) { initArr = []; }
  if (link) link.textContent = '\u26a0 ' + initArr.length + ' error' + (initArr.length === 1 ? '' : 's');

  // Close on overlay background click
  if (overlay) {
    overlay.addEventListener('click', function (e) {
      if (e.target === overlay) overlay.style.display = 'none';
    });
  }
});
</script>

</body>
</html>
